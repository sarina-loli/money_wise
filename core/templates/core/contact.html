{% extends "base.html" %}
{% block title %}Contact — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section container-narrow container">
    <div class="section-head reveal-up" style="text-align:left; margin-bottom:30px;">
        <span class="eyebrow">Contact</span>
        <h2>We'd love to hear from you</h2>
        <p>Questions, feedback, or partnership ideas — send us a note.</p>
    </div>
    <div class="auth-card reveal-up delay-1" style="max-width:none; padding:36px;">
        <form method="post" class="auth-form">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-input" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" name="email" required>
                </div>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea class="form-input" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg btn-ripple">Send Message</button>
        </form>
    </div>
</section>
{% endblock %}
