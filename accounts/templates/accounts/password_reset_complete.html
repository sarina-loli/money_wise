{% extends "base.html" %}
{% block title %}Password Reset Complete — {{ SITE_NAME }}{% endblock %}
{% block body_class %}auth-body{% endblock %}

{% block content %}
<section class="auth-section auth-section-centered">
    <div class="auth-form-wrap reveal-up">
        <div class="auth-card auth-card-center">
            <div class="success-check">✓</div>
            <h1>Password Reset!</h1>
            <p class="auth-subtitle">Your password has been updated. You can now log in with your new password.</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block btn-lg btn-ripple">Log In</a>
        </div>
    </div>
</section>
{% endblock %}
